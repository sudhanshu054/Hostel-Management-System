services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hostel_management
      POSTGRES_USER: hostel
      POSTGRES_PASSWORD: hostel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel -d hostel_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hostel_management
      SPRING_DATASOURCE_USERNAME: hostel
      SPRING_DATASOURCE_PASSWORD: hostel_password
      JWT_SECRET: change-this-secret-in-production-change-this-secret
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SEED_SAMPLE_DATA: true
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
