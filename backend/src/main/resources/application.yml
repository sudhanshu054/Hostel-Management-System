server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hostel_management}
    username: ${SPRING_DATASOURCE_USERNAME:hostel}
    password: ${SPRING_DATASOURCE_PASSWORD:hostel_password}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt-secret: ${JWT_SECRET:change-this-secret-in-production-change-this-secret}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed-sample-data: ${SEED_SAMPLE_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
